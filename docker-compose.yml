# Environnement complet : PostgreSQL, Redis et l'application (API NestJS qui
# sert aussi l'interface Next.js exportée).
#   docker compose up --build
# Application -> http://localhost:3000   (API sous /api)
# DEMO_MODE=true recharge les données de démonstration à chaque démarrage.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk
      POSTGRES_DB: flowdesk
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://flowdesk:flowdesk@postgres:5432/flowdesk
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me
      DEMO_MODE: "true"
    ports: ["3000:10000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
